</script>
<style>
/* design-pro tokens */
:root{
  color-scheme:light dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --t-fast:120ms; --t-med:220ms; --t-slow:360ms;
  --blur:saturate(180%) blur(20px); --tap:44px;
}
:root,:root[data-theme="light"]{
  --bg:#f2f2f7; --surface:rgba(255,255,255,.74); --surface-solid:#fff;
  --bar:rgba(242,242,247,.8); --bar-solid:#f2f2f7;
  --field:rgba(118,118,128,.12); --seg-on:#fff; --sep:rgba(60,60,67,.14);
  --text:#1c1c1e; --text-2:#636366;
  --accent:#007aff; --accent-text:#0062cc; --accent-fill:#0071e3; --on-accent:#fff;
  --ok:#34c759; --ok-text:#11702c; --ok-bg:rgba(52,199,89,.14);
  --glow1:rgba(10,132,255,.22); --glow2:rgba(94,92,230,.18); --glow3:rgba(48,209,88,.12);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --surface:rgba(28,28,30,.72); --surface-solid:#1c1c1e;
    --bar:rgba(0,0,0,.72); --bar-solid:#0b0b0c;
    --field:rgba(118,118,128,.24); --seg-on:#636366; --sep:rgba(255,255,255,.1);
    --text:#f5f5f7; --text-2:#98989f;
    --accent:#0a84ff; --accent-text:#4da3ff; --accent-fill:#0071e3; --on-accent:#fff;
    --ok:#30d158; --ok-text:#30d158; --ok-bg:rgba(48,209,88,.16);
    --glow1:rgba(10,132,255,.24); --glow2:rgba(94,92,230,.2); --glow3:rgba(48,209,88,.1);
    --shadow:0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#000; --surface:rgba(28,28,30,.72); --surface-solid:#1c1c1e;
  --bar:rgba(0,0,0,.72); --bar-solid:#0b0b0c;
  --field:rgba(118,118,128,.24); --seg-on:#636366; --sep:rgba(255,255,255,.1);
  --text:#f5f5f7; --text-2:#98989f;
  --accent:#0a84ff; --accent-text:#4da3ff; --accent-fill:#0071e3; --on-accent:#fff;
  --ok:#30d158; --ok-text:#30d158; --ok-bg:rgba(48,209,88,.16);
  --glow1:rgba(10,132,255,.24); --glow2:rgba(94,92,230,.2); --glow3:rgba(48,209,88,.1);
  --shadow:0 8px 28px rgba(0,0,0,.5);
}

/* base */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:140px}
body{margin:0;min-height:100vh;min-height:100dvh;font:400 17px/1.47 var(--font);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:clip;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}

body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,var(--glow1),transparent 70%),
             radial-gradient(35% 30% at 90% 20%,var(--glow2),transparent 70%),
             radial-gradient(40% 40% at 60% 100%,var(--glow3),transparent 70%)}

/* glass with fallbacks */
.glass{background:var(--surface-solid);border:1px solid var(--sep);box-shadow:var(--shadow)}
.bar{background:var(--bar-solid)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  .bar{background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
}
@media (prefers-reduced-transparency:reduce){
  .glass{background:var(--surface-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  .bar{background:var(--bar-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 40px}
header.top{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 20px) 0 4px}
.logo{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#0a84ff,#5e5ce6);box-shadow:0 6px 18px rgba(10,132,255,.35)}
.logo svg{width:28px;height:28px}
.eyebrow{font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:32px;line-height:1.1;margin:2px 0 0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hbtns{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.round{min-width:var(--tap);height:var(--tap);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  color:var(--text);text-decoration:none;cursor:pointer;font-size:15px;font-weight:600;padding:0 8px;
  transition:transform var(--t-fast) var(--ease),opacity var(--t-fast)}
.round:active{transform:scale(.95);opacity:.8}
button.round{border:1px solid var(--sep)}
.acct{padding:0 14px 0 7px}
.acct img,.acct .av{width:30px;height:30px;border-radius:50%;display:block}
.acct .av{display:grid;place-items:center;color:#fff;font-size:14px;background:linear-gradient(135deg,#0a84ff,#5e5ce6)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px;padding:0;list-style:none}
.stat{border-radius:18px;padding:12px 14px;min-width:0}
.stat b{display:block;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{display:block;font-size:13px;color:var(--text-2);margin-top:2px}

.toolbar{position:sticky;top:0;z-index:10;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;
  display:flex;gap:10px;border-bottom:1px solid transparent;transition:border-color var(--t-med)}
.toolbar.stuck{border-bottom-color:var(--sep)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:0 12px;min-height:var(--tap);color:var(--text-2);cursor:text}
.search:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:17px;min-width:0;height:var(--tap);padding:0}
.search input::placeholder{color:var(--text-2);opacity:1}
.seg{display:flex;background:var(--field);border-radius:13px;padding:2px;flex:none;gap:2px}
.seg button{border:0;background:transparent;color:var(--text);font-size:15px;font-weight:600;padding:0 14px;border-radius:9px;cursor:pointer;
  min-height:var(--tap);transition:background var(--t-med) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 4px rgba(0,0,0,.15)}

.count{font-size:13px;color:var(--text-2);margin:6px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{position:relative;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;
  animation:in var(--t-slow) var(--ease) both;transition:transform var(--t-med) var(--ease),box-shadow var(--t-med)}
@media (hover:hover){.card:hover{transform:translateY(-2px)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ctop{display:flex;gap:12px;align-items:flex-start}
.ic{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff}
.ctxt{min-width:0;flex:1}
.title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:2px 0 3px;line-height:1.25;text-wrap:balance}
.slug{font:13px/1.35 var(--mono);color:var(--text-2);overflow-wrap:anywhere}
.badge{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap;
  color:var(--ok-text);background:var(--ok-bg);padding:5px 10px;border-radius:999px}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.badge.off{color:var(--text-2);background:var(--field)} .badge.off i{background:var(--text-2);box-shadow:none}
.desc{font-size:15px;line-height:1.47;color:var(--text);margin:0;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text-2)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%}
.btns{display:grid;grid-template-columns:1fr auto;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:var(--tap);border-radius:14px;text-decoration:none;
  font-weight:600;font-size:15px;transition:transform var(--t-fast) var(--ease),opacity var(--t-fast)}
.btn:active{transform:scale(.97);opacity:.85}
.primary{background:var(--accent-fill);color:var(--on-accent)}
.primary.dis{background:var(--field);color:var(--text-2);cursor:not-allowed}
.ghost{background:var(--field);color:var(--accent-text);padding:0 18px}
.empty{grid-column:1/-1;text-align:center;color:var(--text-2);padding:40px 10px;font-size:15px}
footer.note{text-align:center;color:var(--text-2);padding:24px 10px 0;font-size:13px}
.skel{height:220px;border-radius:22px;background:linear-gradient(90deg,var(--field),transparent,var(--field));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:560px){
  h1{font-size:28px}
  .acct span{display:none} .acct{padding:0 7px}
  .stats{grid-template-columns:1fr 1fr 1.6fr;gap:8px} .stat{padding:11px 12px} .stat b{font-size:19px}
  .toolbar{flex-direction:column;gap:8px} .seg button{flex:1}
  .grid{grid-template-columns:1fr}
}
@media (min-width:900px){.wrap{padding:0 24px 48px}.toolbar{margin:0 -24px;padding-left:24px;padding-right:24px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .card:hover{transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/></svg>
    </div>
    <div style="min-width:0">
      <div class="eyebrow">GitHub</div>
      <h1>Centrum dowodzenia</h1>
    </div>
    <div class="hbtns">
      <button id="theme" class="round glass" type="button" aria-label="Motyw: automatyczny" title="Motyw: automatyczny"></button>
      <a class="round glass acct" href="https://github.com/damiangrok5-droid" target="_blank" rel="noopener" aria-label="Profil damiangrok5-droid na GitHubie">
        <img src="https://avatars.githubusercontent.com/u/347927826?v=4" alt="" width="30" height="30" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('b'),{className:'av',textContent:'D'}))">
        <span>damiangrok5-droid</span>
      </a>
    </div>
  </header>

  <ul class="stats" aria-label="Podsumowanie">
    <li class="stat glass"><b id="sTotal" class="num">–</b><span>Projekty</span></li>
    <li class="stat glass"><b id="sOnline" class="num">–</b><span>Online</span></li>
    <li class="stat glass"><b id="sLast" class="num">–</b><span>Ostatnia zmiana</span></li>
  </ul>

  <div class="toolbar" id="toolbar">
    <label class="search">
      <span class="sr-only">Szukaj projektu</span>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Szukaj projektu" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="seg" role="group" aria-label="Sortowanie">
      <button type="button" aria-pressed="true" data-sort="pushed">Ostatnie zmiany</button>
      <button type="button" aria-pressed="false" data-sort="name">Nazwa A–Z</button>
    </div>
  </div>

  <main>
    <div id="count" class="count" role="status" aria-live="polite"></div>
    <div id="grid" class="grid" aria-busy="true"><div class="skel"></div><div class="skel"></div></div>
  </main>
  <footer id="note" class="note"></footer>
</div>

<script>
const USER = "damiangrok5-droid";
const SELF = "centrum-dowodzenia";
const API = `https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`;
const FALLBACK_META = {
  "pharma-market-intelligence-pl-app": {title:"Pharma Market Intelligence PL", description:"Statyczny dashboard rynku leków refundowanych w Polsce na danych publicznych.", emoji:"💊"},
  "trener-gitara": {title:"Trener Gitara", description:"Aplikacja do nauki gry na gitarze.", emoji:"🎸"},
  "okazje-gitarowe": {title:"Okazje Gitarowe", emoji:"🏷️"},
  "grok-zwiadowca": {title:"Zwiadowca Rozwiązań", description:"Zwiad MCP, skilli, promptów i automatyzacji do wykorzystania z Grok Botem – z oceną, trudnością i gotowymi promptami.", emoji:"🔭"}
};
const LANG = {JavaScript:"#f1e05a",TypeScript:"#3178c6",HTML:"#e34c26",CSS:"#663399",Python:"#3572A5",Java:"#b07219",
  "C#":"#178600",Go:"#00ADD8",Rust:"#dea584",Swift:"#F05138",Kotlin:"#A97BFF",Vue:"#41b883",Shell:"#89e051",PHP:"#4F5D95",Dart:"#00B4AB"};
const GRADS = [["#0a84ff","#5e5ce6"],["#ff9f0a","#ff375f"],["#30d158","#0a84ff"],["#bf5af2","#ff375f"],["#64d2ff","#5e5ce6"],["#ff453a","#ff9f0a"]];
const ICONS = {
  clock:'<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  ext:'<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  code:'<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4"/></svg>',
  auto:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg>',
  light:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>',
  dark:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
};

/* motyw: auto → jasny → ciemny */
const THEMES = ["auto","light","dark"], THEME_PL = {auto:"automatyczny", light:"jasny", dark:"ciemny"};
function applyTheme(t){
  const root = document.documentElement;
  if(t==="auto") delete root.dataset.theme; else root.dataset.theme = t;
  try{ t==="auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", t); }catch(e){}
  const dark = t==="dark" || (t==="auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    if(t==="auto"){ m.content = m.media.includes("dark") ? "#000000" : "#f2f2f7"; } else m.content = dark ? "#000000" : "#f2f2f7";
  });
  const b = document.getElementById("theme");
  b.innerHTML = ICONS[t]; b.setAttribute("aria-label", `Motyw: ${THEME_PL[t]}. Zmień`); b.title = `Motyw: ${THEME_PL[t]}`;
}
let theme = document.documentElement.dataset.theme || "auto";
applyTheme(theme);
document.getElementById("theme").addEventListener("click", () => { theme = THEMES[(THEMES.indexOf(theme)+1)%3]; applyTheme(theme); });

let repos = [], meta = {}, sortBy = "pushed", source = "";

const rtf = new Intl.RelativeTimeFormat("pl", {numeric:"auto"});
const rtfShort = new Intl.RelativeTimeFormat("pl", {numeric:"auto", style:"short"});
function ago(iso, short){
  if(!iso) return "–";
  const f = short ? rtfShort : rtf;
  const s = (new Date(iso) - Date.now())/1000;
  const units = [["year",31536000],["month",2592000],["week",604800],["day",86400],["hour",3600],["minute",60]];
  for(const [u,sec] of units){ if(Math.abs(s) >= sec) return f.format(Math.round(s/sec), u); }
  return "przed chwilą";
}
function prettify(name){
  return name.replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()).replace(/\bPl\b/g,"PL").replace(/\bApp\b/g,"").trim();
}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function plural(n){ const m10=n%10, m100=n%100; return n===1 ? "projekt" : (m10>=2&&m10<=4&&!(m100>=12&&m100<=14)) ? "projekty" : "projektów"; }

function normalize(list){
  return list.filter(r => !r.fork && r.name !== SELF && !r.archived).map(r => {
    const home = (r.homepage||"").trim();
    const pages = home ? home : (r.has_pages ? `https://${USER}.github.io/${r.name}/` : "");
    return {name:r.name, description:r.description, language:r.language, pushed_at:r.pushed_at,
            html_url:r.html_url || `https://github.com/${USER}/${r.name}`, pages_url:pages, has_pages:!!pages};
  });
}
async function getJSON(url, opts){ const r = await fetch(url, opts); if(!r.ok) throw new Error(r.status); return r.json(); }

async function load(){
  meta = {...FALLBACK_META};
  try { const m = await getJSON("meta.json", {cache:"no-cache"}); Object.assign(meta, m.repos||{}); } catch(e){}
  try {
    repos = normalize(await getJSON(API, {headers:{Accept:"application/vnd.github+json"}}));
    source = "na żywo z GitHuba";
  } catch(e){
    try {
      const snap = await getJSON("repos.json", {cache:"no-cache"});
      repos = normalize(snap.repos||[]);
      source = `z kopii zapasowej (${ago(snap.generated_at)})`;
    } catch(e2){
      repos = []; source = "";
    }
  }
  render();
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let list = repos.map(r => {
    const m = meta[r.name] || {};
    return {...r, title: m.title || prettify(r.name), desc: m.description || r.description || "Brak opisu.", emoji: m.emoji || ""};
  }).filter(r => !q || (r.title+" "+r.name+" "+r.desc+" "+(r.language||"")).toLowerCase().includes(q));
  list.sort(sortBy==="name" ? (a,b)=>a.title.localeCompare(b.title,"pl") : (a,b)=>new Date(b.pushed_at)-new Date(a.pushed_at));

  document.getElementById("sTotal").textContent = repos.length;
  document.getElementById("sOnline").textContent = repos.filter(r=>r.has_pages).length;
  const latest = repos.map(r=>r.pushed_at).sort().pop();
  const sLast = document.getElementById("sLast");
  sLast.textContent = latest ? ago(latest, true) : "–"; sLast.title = latest ? ago(latest) : "";

  const g = document.getElementById("grid"), count = document.getElementById("count");
  g.setAttribute("aria-busy","false");
  if(!repos.length){ count.textContent = ""; g.innerHTML = `<div class="empty">Nie udało się wczytać projektów. Sprawdź połączenie i odśwież stronę.</div>`; return; }
  count.textContent = q ? `${list.length} z ${repos.length} projektów` : `${list.length} ${plural(list.length)}`;
  if(!list.length){ g.innerHTML = `<div class="empty">Brak projektów pasujących do „${esc(q)}”.</div>`; return; }
  g.innerHTML = list.map((r,i) => {
    const [c1,c2] = GRADS[hash(r.name)%GRADS.length];
    const icon = r.emoji || esc(r.title.charAt(0).toUpperCase());
    return `<article class="card glass" style="animation-delay:${Math.min(i,8)*40}ms">
      <div class="ctop">
        <div class="ic" style="background:linear-gradient(135deg,${c1},${c2})" aria-hidden="true">${icon}</div>
        <div class="ctxt">
          <h2 class="title">${esc(r.title)}</h2>
          <div class="slug">${esc(r.name).replace(/-/g,"-<wbr>")}</div>
        </div>
        ${r.has_pages ? `<span class="badge"><i aria-hidden="true"></i>Online</span>` : `<span class="badge off"><i aria-hidden="true"></i>Tylko kod</span>`}
      </div>
      <p class="desc">${esc(r.desc)}</p>
      <div class="meta">
        ${r.language ? `<span><i class="dot" style="background:${LANG[r.language]||"#8e8e93"}" aria-hidden="true"></i>${esc(r.language)}</span>` : ""}
        <span>${ICONS.clock}<span class="sr-only">Zmieniono </span>${ago(r.pushed_at)}</span>
      </div>
      <div class="btns">
        ${r.has_pages ? `<a class="btn primary" href="${esc(r.pages_url)}" target="_blank" rel="noopener">Otwórz aplikację ${ICONS.ext}<span class="sr-only"> ${esc(r.title)} (nowa karta)</span></a>`
                      : `<span class="btn primary dis" aria-disabled="true">Brak strony</span>`}
        <a class="btn ghost" href="${esc(r.html_url)}" target="_blank" rel="noopener">${ICONS.code}Kod<span class="sr-only"> ${esc(r.title)} na GitHubie (nowa karta)</span></a>
      </div>
    </article>`;
  }).join("");
  document.getElementById("note").textContent = source ? `Lista wczytana ${source}. Nowe repozytoria pojawiają się automatycznie.` : "";
}

document.getElementById("q").addEventListener("input", render);
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x===b)));
  sortBy = b.dataset.sort; render();
}));
/* cienka linia pod paskiem, gdy przyklejony */
const tb = document.getElementById("toolbar");
new IntersectionObserver(([e]) => { const st = e.intersectionRatio < 1; tb.classList.toggle("stuck", st); tb.classList.toggle("bar", st); }, {threshold:[1], rootMargin:"-1px 0px 0px 0px"}).observe(tb);
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
load();
</script>
</body>
</html>
