name: Odśwież listę repozytoriów
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz repozytoria
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SELF: ${{ github.event.repository.name }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$OWNER/repos?per_page=100&sort=pushed" > raw.json
          jq --arg self "$SELF" '{repos: [ .[] | select(.fork|not) | select(.name != $self)
              | {name, description, language, has_pages, homepage, html_url, pushed_at, archived} ]}' raw.json > new.json
          rm raw.json
          if [ -f repos.json ] && [ "$(jq -S .repos repos.json)" = "$(jq -S .repos new.json)" ]; then
            echo "Bez zmian"; rm new.json; exit 0
          fi
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{generated_at: $t} + .' new.json > repos.json
          rm new.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git commit -m "Aktualizacja listy repozytoriów"
          git push
